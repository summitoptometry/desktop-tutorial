<body>
  <div class="container">
    <h1>近视匹配分析</h1>
    <p class="subtitle">手机版 · 输入出生日期、性别及双眼眼轴曲率，获取相似案例分析</p>

    <div class="card params-card" id="paramsCard">
      <div class="params-card-header" id="paramsCardHeader">
        <span class="params-card-title">匹配参数</span>
        <span class="params-card-arrow" id="paramsCardArrow">▲</span>
      </div>
      <div class="params-card-body" id="paramsCardBody">
      <form id="analysisForm">
        <div class="form-row form-row-2col">
          <div class="form-group">
            <label>出生日期</label>
            <input type="date" id="birthDate" required />
          </div>
          <div class="form-group">
            <label>性别</label>
            <select id="gender">
              <option value="male">男</option>
              <option value="female">女</option>
            </select>
          </div>
        </div>
        <div class="eye-section">
          <div class="section-title">右眼</div>
          <div class="form-row form-row-3col">
            <div class="form-group"><label>眼轴长度(mm)</label><input type="number" id="rightAl" min="20" max="30" step="0.01" placeholder="如 24.5" /></div>
            <div class="form-group"><label>K1(D)</label><input type="number" id="rightK1" min="35" max="50" step="0.01" placeholder="如 43.0" /></div>
            <div class="form-group"><label>K2(D)</label><input type="number" id="rightK2" min="35" max="50" step="0.01" placeholder="可选" /></div>
          </div>
        </div>
        <div class="eye-section">
          <div class="section-title">左眼</div>
          <div class="form-row form-row-3col">
            <div class="form-group"><label>眼轴长度(mm)</label><input type="number" id="leftAl" min="20" max="30" step="0.01" placeholder="如 24.5" /></div>
            <div class="form-group"><label>K1(D)</label><input type="number" id="leftK1" min="35" max="50" step="0.01" placeholder="如 43.0" /></div>
            <div class="form-group"><label>K2(D)</label><input type="number" id="leftK2" min="35" max="50" step="0.01" placeholder="可选" /></div>
          </div>
        </div>
        <div class="advanced-toggle" id="advancedToggle">▼ 高级参数</div>
        <div class="advanced-params" id="advancedParams" style="display:none;">
          <div class="form-row form-row-2col">
            <div class="form-group"><label>眼轴容差(mm)</label><input type="number" id="alTol" min="0" max="2" step="0.1" value="0.5" /></div>
            <div class="form-group"><label>K1 容差(D)</label><input type="number" id="k1Tol" min="0" max="5" step="0.1" value="0.5" /></div>
            <div class="form-group"><label>散光容差(D)</label><input type="number" id="astTol" min="0" max="2" step="0.1" value="0.5" /></div>
            <div class="form-group"><label>年龄容差(月，空=不限制)</label><input type="number" id="ageMonthsTol" min="1" max="24" placeholder="不填即不限制" /></div>
            <div class="form-group"><label>结果数量(条，空=不限制)</label><input type="number" id="limit" min="1" max="10000" placeholder="不填即不限制" /></div>
          </div>
        </div>
        <div class="btn-row">
          <button type="submit" class="btn btn-primary" id="submitBtn">查找相似案例</button>
          <button type="button" class="btn btn-default" id="resetBtn">重置</button>
        </div>
      </form>
      </div>
    </div>

    <div id="errorBox" class="error-msg" style="display:none;"></div>
    <div id="loadingBox" class="card loading" style="display:none;"><div class="spinner"></div><div>正在查找相似案例...</div></div>

    <div id="resultsArea" style="display:none;">
      <div class="results-tabs-label">切换查看：</div>
      <div class="pagination-nav">
        <div class="pagination-tabs">
          <div class="pagination-tab active" data-tab="stats"><span class="tab-icon">📊</span><span>治疗手段统计</span></div>
          <div class="pagination-tab" data-tab="axial"><span class="tab-icon">📈</span><span>眼轴变化分析</span></div>
        </div>
      </div>
      <div id="tabStats" class="tab-panel">
        <div class="stats-card">
          <div class="card-header">
            <div class="card-title"><span class="title-icon">📊</span><span>相似案例匹配结果</span></div>
            <div class="card-subtitle" id="statsSubtitle"></div>
          </div>
          <div class="stats-section">
            <div class="stats-section-title">治疗手段选择率</div>
            <div class="stats-grid" id="statsGrid"></div>
          </div>
          <div class="stats-section" id="detailStatsSection">
            <div class="stats-section-title">详细分类统计</div>
            <div class="detailed-stats-row" id="detailStats"></div>
          </div>

            <div class="distribution-row">
              <div class="distribution-item" id="reviewCycleDist"></div>
              <div class="distribution-item" id="ageDist"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="tabAxial" class="tab-panel" style="display:none;">
        <div class="stats-card">
          <div class="card-header" id="axialCardHeader" style="display:none;">
            <div class="card-title"><span class="title-icon">📈</span><span>眼轴变化分析</span></div>
            <div class="card-subtitle" id="axialSubtitle"></div>
          </div>
          <div id="axialContent"></div>
        </div>
      </div>
    </div>

    <div id="noResultsBox" class="card no-results-card" style="display:none;">
      <div class="no-results-icon">🔍</div>
      <div class="no-results-title">未找到匹配的案例</div>
      <div class="no-results-tip">请尝试放宽容差或调整参数</div>
    </div>
  </div>

  <script>
    (function () {
      var API_BASE = 'https://aiforoptometry.com';
      var lastMatchResults = [];
      var groupingMode = 'type';
      var showNoTreatment = false;
      var sortBy = 'monthlyChange';
      function formatDate(date) {
        if (!date) return '-';
        var d = new Date(date);
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }
      function getMonthsDifference(s, e) { return Math.round((new Date(e) - new Date(s)) / (1000 * 60 * 60 * 24 * 30)); }
      function getTreatmentKey(td, mode) {
        td = td || {};
        var t = [];
        if (td.阿托品 === '是') t.push('阿托品');
        if (td.配镜手段 && td.配镜手段 !== '无' && td.配镜手段 !== '否') {
          if (mode === 'brand') {
            var brand = td.眼镜品牌;
            if (brand && brand !== '无' && brand !== '否' && brand !== '') t.push(td.配镜手段 + '(' + brand + ')');
            else t.push(td.配镜手段);
          } else t.push(td.配镜手段);
        }
        var p = td.哺光仪 || td.低强度红光;
        if (p && p !== '无' && p !== '否') {
          if (mode === 'brand') {
            var gear = (td.档位 && td.档位 !== '无' && td.档位 !== '否') ? td.档位 : '未知档位';
            t.push('低强度红光(' + p + '-' + gear + ')');
          } else t.push('低强度红光');
        }
        if (td.理疗 === '是') t.push('理疗');
        if (td.视觉训练 === '是') t.push('视觉训练');
        return t.length ? t.join(' + ') : '无治疗';
      }
      function hasValidValue(v) { return v != null && v !== '' && v !== '无' && v !== '否'; }
      function calculateAnalysisStats(results) {
        if (!results || !results.length) return null;
        var total = results.length, at = 0, gl = 0, ph = 0, py = 0, vt = 0, gb = {}, pg = {}, rc = {}, ad = [];
        results.forEach(function (r) {
          var td = r.治疗手段详情 || {};
          if (hasValidValue(td.阿托品) && td.阿托品 !== '否') at++;
          if (hasValidValue(td.配镜手段)) { gl++; if (hasValidValue(td.眼镜品牌)) gb[td.眼镜品牌] = (gb[td.眼镜品牌] || 0) + 1; }
          var pv = td.哺光仪 || td.低强度红光;
          if (hasValidValue(pv)) { ph++; var gear = hasValidValue(td.档位) ? td.档位 : '未知'; pg[pv + '-' + gear] = (pg[pv + '-' + gear] || 0) + 1; }
          if (hasValidValue(td.理疗) && td.理疗 !== '否') py++;
          if (hasValidValue(td.视觉训练) && td.视觉训练 !== '否') vt++;
          var cy = r['复查间隔(月)'];
          if (cy != null && cy !== '' && !isNaN(cy)) { rc[cy] = rc[cy] || { count: 0 }; rc[cy].count++; }
          if (r['年龄差(天)'] != null) ad.push(r['年龄差(天)']);
        });
        function top3(o, tot) { return Object.entries(o).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 3).map(function (e) { return { name: e[0], count: e[1], rate: Math.round((e[1] / tot) * 100) }; }); }
        Object.keys(rc).forEach(function (k) { rc[k].percentage = Math.round((rc[k].count / total) * 100); });
        var avg = ad.length ? Math.round(ad.reduce(function (a, b) { return a + b; }, 0) / ad.length) : 0, min = ad.length ? Math.min.apply(null, ad) : 0, max = ad.length ? Math.max.apply(null, ad) : 0;
